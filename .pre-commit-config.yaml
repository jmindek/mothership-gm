repos:
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript Type Check (tsc)
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: Unit Tests (vitest)
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true

      - id: build
        name: Vite Build Verification
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
